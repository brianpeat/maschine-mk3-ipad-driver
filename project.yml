name: MK3
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
targets:
  MK3:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).mk3
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MK3 Driver
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: MK3Driver
        embed: true
        codeSign: true
  MK3Driver:
    type: driver-extension
    platform: iOS
    sources: [Driver]
    settings:
      base:
        SDKROOT: driverkit
        SUPPORTED_PLATFORMS: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "24.0"
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).mk3.driver
        PRODUCT_NAME: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: Driver/Info.plist
        CODE_SIGN_ENTITLEMENTS: Driver/MK3Driver.entitlements
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
        RUN_CLANG_STATIC_ANALYZER: NO
    dependencies:
      - sdk: DriverKit.framework
      - sdk: USBDriverKit.framework
      - sdk: MIDIDriverKit.framework
